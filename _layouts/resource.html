---
layout: default
---

<main class="bg-saints-white dark:bg-saints-black min-h-screen">
  <div class="mx-auto max-w-4xl px-6 py-16 lg:px-8 lg:py-24">
    <article class="animate-children">

      <!-- Breadcrumbs (auto-generated from URL) -->
      <div class="child">
        {% include breadcrumbs.html %}
      </div>

      <!-- Header -->
      <header class="child mb-8 text-center">
        <h1 class="mb-4 font-display text-4xl leading-[1.15] font-bold tracking-tight text-balance text-stone-900 sm:text-5xl dark:text-white">
          {{ page.title }}
        </h1>
        {% if page.theme %}
        <p class="mx-auto max-w-2xl text-lg text-stone-600 dark:text-stone-400">
          Theme: {{ page.theme }}
        </p>
        {% endif %}
        {% if page.description %}
        <p class="mx-auto mt-4 max-w-2xl text-lg text-stone-600 dark:text-stone-400">
          {{ page.description }}
        </p>
        {% endif %}
      </header>

      <!-- Content -->
      <div class="child prose-zinc mx-auto max-w-prose prose prose-lg [--delay:0.15s] dark:prose-invert [&>h1]:mb-6 [&>h1]:font-display [&>h1]:text-3xl [&>h1]:font-bold [&>h1]:tracking-tight [&>h2]:mt-10 [&>h2]:mb-4 [&>h2]:font-display [&>h2]:text-2xl [&>h2]:font-semibold [&>h2]:tracking-tight [&>h3]:mt-8 [&>h3]:mb-3 [&>h3]:font-display [&>h3]:text-xl [&>h3]:font-semibold [&>h3]:tracking-tight">
        {{ content }}
      </div>

    </article>
  </div>

  {% include cta.html %}
</main>
