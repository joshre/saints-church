<div class="mx-auto mt-20 max-w-7xl animate-children px-6 sm:mt-32 lg:px-8">
  <div class="child mx-auto max-w-2xl lg:mx-0 lg:max-w-3xl">
    <h2 id="schedule-heading" class="font-display text-4xl font-semibold tracking-tight text-pretty text-stone-900 sm:text-5xl dark:text-white">{{ site.data.content.schedule.title }}</h2>
    <p class="mt-6 text-lg/8 text-stone-700 dark:text-stone-300">{{ site.data.content.schedule.subtitle }}</p>
    
    <div class="child mt-8 border-t border-stone-200 ![--delay:0.15s] dark:border-white/10">
      <dl class="divide-y divide-stone-200 dark:divide-white/10">
        {% for item in site.data.content.schedule.items %}
          {% assign delay = forloop.index0 | times: 0.1 | plus: 0.25 %}
          <div class="child flex flex-col gap-1 px-4 py-5 sm:flex-row sm:items-baseline sm:gap-8 sm:px-0" style="--delay: {{ delay }}s">
            <dt class="flex-shrink-0 font-display text-base/6 font-semibold text-stone-900 tabular-nums sm:w-24 dark:text-stone-100"><time>{{ item.time }}</time></dt>
            <dd class="max-w-prose text-sm/6 text-stone-700 dark:text-stone-400">{{ item.activity }}</dd>
          </div>
        {% endfor %}
      </dl>
    </div>
  </div>
</div>
