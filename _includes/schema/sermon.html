<!-- Sermon JSON-LD @graph: Article (with Person author) + BreadcrumbList + WebPage -->
{% assign sermon_webpage_id = page.url | absolute_url | append: '#webpage' %}
{% assign sermon_article_id = page.url | absolute_url | append: '#article' %}
{% assign sermon_breadcrumb_id = page.url | absolute_url | append: '#breadcrumb' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": {{ sermon_webpage_id | jsonify | replace: '</', '<\/' }},
      "url": {{ page.url | absolute_url | jsonify | replace: '</', '<\/' }},
      "name": {{ page.title | jsonify | replace: '</', '<\/' }},
      "description": {{ page.description | default: page.title | strip_html | truncate: 200 | jsonify | replace: '</', '<\/' }},
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "about": { "@id": "{{ site.url }}/#org" },
      "inLanguage": "en-US"
    },
    {
      "@type": "Article",
      "@id": {{ sermon_article_id | jsonify | replace: '</', '<\/' }},
      "headline": {{ page.title | jsonify | replace: '</', '<\/' }},
      "description": {{ page.description | default: page.title | strip_html | truncate: 200 | jsonify | replace: '</', '<\/' }},
      "datePublished": {{ page.date | date_to_xmlschema | jsonify | replace: '</', '<\/' }},
      "dateModified": {{ page.date | date_to_xmlschema | jsonify | replace: '</', '<\/' }},
      "author": {
        "@type": "Person",
        "@id": "{{ site.url }}/#author-nate-ellis",
        "name": {{ page.pastor | default: 'Pastor Nate Ellis' | jsonify | replace: '</', '<\/' }},
        "jobTitle": "Pastor",
        "worksFor": { "@id": "{{ site.url }}/#org" }
      },
      "publisher": { "@id": "{{ site.url }}/#org" },
      "mainEntityOfPage": { "@id": {{ sermon_webpage_id | jsonify | replace: '</', '<\/' }} },
      "image": {{ site.data.content.seo.meta.social_image | absolute_url | jsonify | replace: '</', '<\/' }},
      {% if page.audio_url %}"associatedMedia": {
        "@type": "AudioObject",
        "contentUrl": {{ page.audio_url | jsonify | replace: '</', '<\/' }},
        "encodingFormat": "audio/mpeg",
        "name": {{ page.title | append: ' - Audio' | jsonify | replace: '</', '<\/' }},
        {%- comment -%}
          ISO 8601 duration. Sermon front-matter uses MM:SS (e.g. "27:14").
          We assemble PTxxMyyS explicitly and only emit when both segments are present
          so a stray "1:02:14" (HH:MM:SS) or other shape is skipped rather than producing
          malformed output like PT1M02M14S.
        {%- endcomment -%}
        {%- if page.duration -%}
          {%- assign duration_parts = page.duration | split: ':' -%}
          {%- if duration_parts.size == 2 -%}
            "duration": {{ duration_parts[0] | prepend: 'PT' | append: 'M' | append: duration_parts[1] | append: 'S' | jsonify | replace: '</', '<\/' }},
          {%- endif -%}
        {%- endif -%}
        "creator": { "@id": "{{ site.url }}/#author-nate-ellis" }
      },
      {% endif %}"about": [
        { "@type": "Thing", "name": "Reformed Baptist Theology" },
        { "@type": "Thing", "name": "Expository Preaching" }
        {%- if page.scripture -%},
        { "@type": "Thing", "name": {{ page.scripture | jsonify | replace: '</', '<\/' }} }
        {%- endif -%}
        {%- if page.series -%},
        { "@type": "CreativeWorkSeries", "name": {{ page.series | jsonify | replace: '</', '<\/' }} }
        {%- endif %}
      ],
      "isPartOf": {
        "@type": "PodcastSeries",
        "name": {{ site.podcast.title | jsonify | replace: '</', '<\/' }},
        "url": {{ site.podcast.rss_url | jsonify | replace: '</', '<\/' }},
        "description": {{ site.podcast.description | jsonify | replace: '</', '<\/' }}
      },
      "genre": "Religious",
      "inLanguage": "en-US"
    },
    {
      "@type": "BreadcrumbList",
      "@id": {{ sermon_breadcrumb_id | jsonify | replace: '</', '<\/' }},
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "{{ site.url }}"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Sermons",
          "item": "{{ site.url }}/sermons/"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": {{ page.title | jsonify | replace: '</', '<\/' }},
          "item": {{ page.url | absolute_url | jsonify | replace: '</', '<\/' }}
        }
      ]
    }
  ]
}
</script>
