{%- assign wg_copy = site.data.content.worship_guide -%}
<div class="wg-resources">
  <a class="wg-button" href="/resources/" onclick="window.plausible&&plausible('Resources',{props:{source:'worship-guide',sunday:'{{ include.guide.sunday | date: "%Y-%m-%d" }}'}})">
    <span>{{ wg_copy.resources_button }}</span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9.5M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div class="wg-resource-list">{{ wg_copy.resources_list }}</div>
</div>
