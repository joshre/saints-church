<!-- Prayer Gathering Card Component -->
<a
  href="{{ include.gathering.url }}"
  class="group flex items-center gap-3.5 rounded-lg bg-white p-4 shadow-[0px_0px_0px_1px_rgba(9,9,11,0.06),0px_2px_2px_0px_rgba(9,9,11,0.04)] transition-all duration-300 hover:shadow-[0px_0px_0px_1px_rgba(9,9,11,0.06),0px_3px_6px_0px_rgba(9,9,11,0.06)] dark:bg-stone-900 dark:shadow-[0px_0px_0px_1px_rgba(255,255,255,0.1)] dark:hover:shadow-[0px_0px_0px_1px_rgba(255,255,255,0.15),0px_3px_6px_0px_rgba(0,0,0,0.25)]"
>
  <div class="bg-saints-100/50 dark:bg-saints-900/30 flex h-14 w-14 flex-shrink-0 flex-col items-center justify-center rounded-md">
    <span class="text-saints-600 dark:text-saints-400 text-xs leading-none font-semibold tracking-wide uppercase">
      {{ include.gathering.date | date: "%b" }}
    </span>
    <span class="mt-0.5 font-display text-lg leading-none font-bold text-stone-900 dark:text-white">
      &rsquo;{{ include.gathering.date | date: "%y" }}
    </span>
  </div>
  <div class="min-w-0 flex-1">
    <h3 class="dark:group-hover:text-saints-400 group-hover:text-saints-700 text-base leading-tight font-semibold tracking-tight text-stone-900 transition-colors dark:text-white">
      {{ include.gathering.theme }}
    </h3>
  </div>
</a>
