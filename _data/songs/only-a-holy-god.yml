---
title: "Only A Holy God"
writers: "Jonny Robinson, Rich Thompson, Dustin Smith, Michael Farren"
ccli: 7073332
stanzas:
  - number: 1
    lines: |
      Who else commands
      All the hosts of Heaven
      Who else could make
      Every king bow down
      Who else can whisper
      And darkness trembles
      Only a Holy God
  - number: 2
    lines: |
      What other beauty
      Demands such praises
      What other splendor
      Outshines the sun
      What other majesty
      Rules with justice
      Only a Holy God
  - refrain: true
    lines: |
      Come and behold Him
      The One and the Only
      Cry out sing holy
      Forever a Holy God
      Come and worship the Holy God
  - number: 3
    lines: |
      What other glory
      Consumes like fire
      What other power
      Can raise the dead
      What other name
      Remains undefeated
      Only a Holy God
  - number: 4
    lines: |
      Who else could rescue me
      From my failing
      Who else would offer
      His only Son
      Who else invites me
      To call Him Father
      Only a Holy God
