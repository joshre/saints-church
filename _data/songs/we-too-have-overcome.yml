---
title: "We Too Have Overcome"
writers: "Ben Fielding, Jonny Robinson, Rich Thompson"
ccli: 7253278
stanzas:
  - number: 1
    lines: |
      Take heart where there is trouble
      This world belongs to Him
      Rely upon the words of Christ the King
      He said there would be trials
      But He has overcome
      The battle is the Lord’s and He has won
  - number: 2
    lines: |
      Take heart where there is failure
      Where sin fights for a hold
      Rely upon the power of His blood
      There is no condemnation
      For Jesus paid it all
      So praise the God of mercy, oh my soul
  - refrain: true
    lines: |
      On the cross He stormed the prison
      By His death He broke the bars
      When He rose He freed His children from the dark
      And He bound the great deceiver
      And He leads me in His love
      Praise God, in Christ we too have overcome
  - number: 3
    lines: |
      Take heart where there is sorrow
      In sickness and in death
      Rely upon the peace that He has sent
      He promises a future
      Where joy will never cease
      And there I know a home awaits for me
  - lines: |
      He is risen and He reigns
      It is finished it is done
      So take heart, He has overcome
      Yes the victory we need
      Is the victory He won
      So take heart, He has overcome
      In Christ we have overcome
